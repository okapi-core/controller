# Okapi overlay for the pinned OpenTelemetry Demo Compose stack.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_PASSWORD: okapi_testing_password
    volumes:
      - otel-clickhouse-data:/var/lib/clickhouse
      - otel-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/okapi-local.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okapi_oscar}
      POSTGRES_USER: ${POSTGRES_USER:-okapi_oscar_user_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okapi_oscar_password}
    volumes:
      - otel-postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  okapi-migrate:
    image: ${OKAPI_IMAGE_REPO:-ghcr.io/okapi-core}/ops:${TAG:-latest}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      OKAPI_WEB_DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-okapi_oscar}?currentSchema=okapi_web
      OKAPI_WEB_DB_MIGRATION_USER: okapi_web_migration_user
      OKAPI_WEB_DB_MIGRATION_PASSWORD: okapi_web_migration_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        java -jar /app/app.jar ch-migrate --host clickhouse --port 8123
        --user default --password okapi_testing_password;
        java -jar /app/app.jar pg-migrate

  okapi-ingester:
    image: ${OKAPI_IMAGE_REPO:-ghcr.io/okapi-core}/ingester:${TAG:-latest}
    depends_on:
      okapi-migrate:
        condition: service_completed_successfully
    environment:
      OKAPI_CLICKHOUSE_HOST: clickhouse
      OKAPI_CLICKHOUSE_PORT: 8123
      OKAPI_CLICKHOUSE_USERNAME: default
      OKAPI_CLICKHOUSE_PASSWORD: okapi_testing_password
    command:
      - --okapi.clickhouse.host=clickhouse
      - --okapi.clickhouse.port=8123
      - --okapi.clickhouse.secure=false
      - --okapi.clickhouse.username=default
      - --okapi.clickhouse.password=okapi_testing_password
      - --okapi.clickhouse.chMetricsWal=/wal/metrics
      - --okapi.clickhouse.chLogsWal=/wal/logs
      - --okapi.clickhouse.chTracesWal=/wal/traces
    ports:
      - "9009:9009"
    volumes:
      - okapi-otel-ingester-wal:/wal

  okapi-web:
    image: ${OKAPI_IMAGE_REPO:-ghcr.io/okapi-core}/web:${TAG:-latest}
    depends_on:
      okapi-migrate:
        condition: service_completed_successfully
      okapi-ingester:
        condition: service_started
      okapi-oscar:
        condition: service_started
    environment:
      OKAPI_CLUSTER_ENDPOINT: http://okapi-ingester:9009
      OKAPI_OSCAR_ENDPOINT: http://okapi-oscar:9002
      OKAPI_WEB_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-okapi_oscar}?currentSchema=okapi_web
      OKAPI_WEB_DB_USER: okapi_web_user
      OKAPI_WEB_DB_PASSWORD: okapi_web_password
    ports:
      - "9001:9001"

  okapi-oscar:
    image: ${OKAPI_IMAGE_REPO:-ghcr.io/okapi-core}/oscar:${TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      okapi-ingester:
        condition: service_started
    environment:
      OKAPI_CLUSTER_ENDPOINT: http://okapi-ingester:9009
      OSCAR_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-okapi_oscar}?currentSchema=okapi_oscar
      OSCAR_DB_USER: okapi_oscar_user
      OSCAR_DB_PASSWORD: okapi_oscar_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-gitlab-ci-test-key}
    command:
      - --okapi.oscar.vault.address=
      - --okapi.oscar.openai.api-key-path=env://OPENAI_API_KEY
    ports:
      - "9002:9002"

  otel-collector:
    depends_on:
      okapi-ingester:
        condition: service_started

volumes:
  otel-clickhouse-data:
  otel-clickhouse-logs:
  otel-postgres-data:
  okapi-otel-ingester-wal:
